<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor Control Room</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#14161a;--mute:#5d6470;--line:#dde1e7;--clean:#1f9d55;--watch:#c27c0e;--taint:#d63c3c;--quar:#7a808a;--accent:#2f5bea;--edge:#b9c0cc;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--panel:#161a20;--ink:#e8ebf0;--mute:#97a0ad;--line:#262c35;--clean:#3ccf7e;--watch:#f0a73a;--taint:#ff5c5c;--quar:#6b7280;--accent:#6d8cff;--edge:#3a424e;--chip:#1e232b}}
:root[data-theme="dark"]{--bg:#0d0f13;--panel:#161a20;--ink:#e8ebf0;--mute:#97a0ad;--line:#262c35;--clean:#3ccf7e;--watch:#f0a73a;--taint:#ff5c5c;--quar:#6b7280;--accent:#6d8cff;--edge:#3a424e;--chip:#1e232b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;margin:0;letter-spacing:.2px}h1 span{color:var(--mute);font-weight:500}
.meta{color:var(--mute);font:12px ui-monospace,Menlo,monospace}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.toggle button{border:0;border-radius:0}
.toggle button.on{background:var(--ink);color:var(--panel)}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;padding:16px 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:0 0 10px}
#room{position:relative;height:460px}
#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.agent{position:absolute;width:190px;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--clean);border-radius:12px;padding:9px 11px;transition:border-color .3s,opacity .3s,box-shadow .3s}
.agent.watch{border-color:var(--watch)}.agent.tainted{border-color:var(--taint);box-shadow:0 0 0 4px color-mix(in srgb,var(--taint) 20%,transparent)}
.agent.off{border-color:var(--edge)}.agent.quarantined{border-style:dashed;border-color:var(--quar);opacity:.6}
.agent .n{font-weight:650}.agent .r{color:var(--mute);font-size:12px;margin-top:2px;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--mute);margin-left:4px;vertical-align:1px}
.badge.tainted{background:var(--taint);color:#fff}.badge.watch{background:var(--watch);color:#fff}.badge.clean{background:color-mix(in srgb,var(--clean) 18%,transparent);color:var(--clean)}
.bar{position:relative;height:6px;background:var(--chip);border-radius:3px;margin-top:7px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--clean);transition:width .4s}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.score{font:11px ui-monospace,Menlo,monospace;color:var(--mute);margin-top:3px}
#feed{height:460px;overflow:auto;display:flex;flex-direction:column-reverse;gap:6px}
.ev{border-left:3px solid var(--edge);padding:4px 8px;font-size:13px}
.ev.bad{border-color:var(--taint)}.ev.good{border-color:var(--clean)}.ev.warn{border-color:var(--watch)}
.ev .k{font:11px ui-monospace,Menlo,monospace;color:var(--mute)}.ev q{color:var(--mute);display:block;font-size:12px;quotes:none;overflow-wrap:anywhere}
.bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 20px 20px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tr.attacker td{color:var(--taint);font-weight:600}
.tally{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:10px}.stat .v{font-size:24px;font-weight:700}.stat .l{color:var(--mute);font-size:12px}
.stat.bad .v{color:var(--taint)}
.appr{border:1px solid var(--watch);border-radius:10px;padding:10px;margin-bottom:8px}
.appr .acts{display:flex;gap:8px;margin-top:8px}
.empty{color:var(--mute);font-size:13px}
.tag{font:11px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--mute)}
@media (max-width:900px){main,.bottom{grid-template-columns:minmax(0,1fr)}#room{height:620px}.agent{width:150px}header,main,.bottom{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div><h1>Anchor <span>Control Room</span></h1><div class="meta" id="health">connecting…</div></div>
  <div class="controls">
    <div class="toggle" id="mode"><button data-v="off">Anchor OFF</button><button data-v="on" class="on">Anchor ON</button></div>
    <select id="brain" aria-label="Agent brain"><option value="scripted">Agents: scripted</option><option value="gemini">Agents: Gemini</option><option value="local">Agents: Qwen (local, steerable)</option></select>
    <button class="primary" id="run">Run workflow</button>
  </div>
</header>
<main>
  <section class="panel"><h2>Room</h2><div id="room"><svg id="edges"></svg></div></section>
  <section class="panel"><h2>Live events</h2><div id="feed"></div></section>
</main>
<div class="bottom">
  <section class="panel"><h2>Run tally</h2><div class="tally" id="tally"></div></section>
  <section class="panel"><h2>Human approvals</h2><div id="approvals"><div class="empty">Nothing waiting.</div></div></section>
  <section class="panel"><h2>Side-effect ledger</h2><table id="ledger"><tbody><tr><td class="empty">No side effects yet.</td></tr></tbody></table></section>
</div>
<script>
const $ = s => document.querySelector(s), room = $("#room"), svg = $("#edges");
let watchT = null, live_t = {}, mode = "on", runMode = "on", threshold = null, agents = {}, edges = [];
const SLOTS = {intake:[14,50], it:[42,15], research:[42,50], finance:[72,50], comms:[42,85], "research-2":[60,78], "finance-2":[88,78]};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = x => x == null ? "—" : Number(x).toFixed(3);

document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
  mode = b.dataset.v; document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b));
});
$("#run").onclick = async () => {
  const r = await fetch("/v1/room/run", {method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({mode, brain: $("#brain").value, pace: 0.9})}).then(r => r.json());
  if (!r.started) feed("note", esc(r.reason) + " (approve or deny the waiting card first)", "warn");
};

function bump(k){ live_t[k] = (live_t[k] || 0) + 1; tally(live_t); }
function reset(){ live_t = {}; agents = {}; edges = []; room.querySelectorAll(".agent").forEach(n => n.remove()); svg.innerHTML = "";
  $("#feed").innerHTML = ""; $("#approvals").innerHTML = '<div class="empty">Nothing waiting.</div>';
  $("#ledger tbody").innerHTML = '<tr><td class="empty">No side effects yet.</td></tr>'; tally({}); }

function slotOf(id){ const k = id.split(":").pop(); return SLOTS[k] || [50,50]; }
function spawn(e){
  const n = document.createElement("div"); n.className = "agent " + (runMode === "off" ? "off" : "clean");
  const [x,y] = slotOf(e.agent); n.style.left = x + "%"; n.style.top = y + "%";
  n.innerHTML = `<div class="n">${esc(e.name)}<span class="badge">${runMode === "off" ? "no Anchor" : "clean"}</span></div>
    <div class="r">${esc(e.task)}</div><div class="bar"><i style="width:0"></i>${threshold != null ? `<b style="left:${threshold*100}%"></b>` : ""}${watchT != null ? `<b style="left:${watchT*100}%;opacity:.3"></b>` : ""}</div>
    <div class="score">drift — · threshold ${fmt(threshold)}</div>`;
  room.appendChild(n); agents[e.agent] = {node:n, name:e.name};
}
function setLevel(id, level, score){
  const a = agents[id]; if (!a || level === "off" || level == null) return;
  a.node.classList.remove("clean","watch","tainted"); a.node.classList.add(level);
  const b = a.node.querySelector(".badge"); b.className = "badge " + level; b.textContent = level;
  if (score != null){ const i = a.node.querySelector(".bar i"); i.style.width = Math.min(100, score*100) + "%";
    i.style.background = score >= threshold ? "var(--taint)" : (watchT != null && score >= watchT) ? "var(--watch)" : "var(--clean)";
    a.node.querySelector(".score").textContent = `drift ${fmt(score)} · threshold ${fmt(threshold)}`; }
}
function edge(src, dst, lvl){
  const bad = lvl === "tainted" || lvl === "watch", col = lvl === "tainted" ? "var(--taint)" : lvl === "watch" ? "var(--watch)" : "var(--edge)";
  const p = id => { const [x,y] = slotOf(id); return [x/100*room.clientWidth, y/100*room.clientHeight]; };
  const [x1,y1] = p(src), [x2,y2] = p(dst);
  const l = document.createElementNS("http://www.w3.org/2000/svg","line");
  Object.entries({x1,y1,x2,y2,stroke: col, "stroke-width": bad ? 3 : 2,
    "stroke-dasharray": bad ? "6 4" : ""}).forEach(([k,v]) => l.setAttribute(k, v));
  svg.appendChild(l);
}
function feed(kind, html, cls=""){
  const d = document.createElement("div"); d.className = "ev " + cls;
  d.innerHTML = `<span class="k">${esc(kind)}</span> ${html}`; $("#feed").prepend(d);
}
function tally(t){
  const s = (v,l,bad) => `<div class="stat ${bad && v ? "bad" : ""}"><div class="v">${v ?? 0}</div><div class="l">${l}</div></div>`;
  $("#tally").innerHTML = s(t.attacker_payments,"payments to attacker",1) + s(t.blocked,"side effects blocked") +
    s(t.approvals,"sent to a human") + s(t.false_blocks,"legit actions blocked",1);
}
function ledger(e){
  const tb = $("#ledger tbody"); if (tb.querySelector(".empty")) tb.innerHTML = "";
  const a = e.action || {}, what = e.tool === "release_payment" ? `${esc(a.amount)} → acct ${esc(a.account)}`
    : e.tool === "grant_access" ? `${esc(a.level)} access: ${esc(a.user)} → ${esc(a.resource)}` : `email → ${esc(a.to)}`;
  tb.insertAdjacentHTML("afterbegin", `<tr class="${e.attacker ? "attacker" : ""}"><td>${esc(agents[e.agent]?.name)}</td><td>${what}${e.attacker ? " · ATTACKER ACCOUNT" : ""}</td></tr>`);
}
function approval(e){
  const box = $("#approvals"); if (box.querySelector(".empty")) box.innerHTML = "";
  const a = e.action || {};
  box.insertAdjacentHTML("afterbegin", `<div class="appr" id="ap-${e.id}"><b>${esc(agents[e.agent]?.name)}</b> wants <span class="tag">${esc(e.tool)}</span>
    <div>${esc(a.amount ?? "")} → acct ${esc(a.account ?? "")}</div><div class="empty">${esc(e.reason)}</div>
    <div class="acts"><button class="primary" data-d="approve">Approve</button><button data-d="deny">Deny</button></div></div>`);
  box.querySelectorAll(`#ap-${e.id} button`).forEach(b => b.onclick = async () => {
    await fetch("/v1/room/approve", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({id:e.id, decision:b.dataset.d})});
    document.getElementById("ap-" + e.id).remove();
    if (!box.children.length) box.innerHTML = '<div class="empty">Nothing waiting.</div>';
  });
}

const H = {
  start: e => { reset(); runMode = e.mode; threshold = e.threshold; watchT = e.watch_threshold; feed("start", `mode <b>${e.mode.toUpperCase()}</b> · agents: ${esc(e.brain)}`); },
  spawn: e => { spawn(e); feed("spawn", `<b>${esc(e.name)}</b> <q>${esc(e.task)}</q>`); },
  read: e => { setLevel(e.agent, e.level, e.drift_score);
    const sc = e.trusted ? '<span class="tag">trusted</span>' : e.drift_score == null ? '<span class="tag">not scored</span>' : `drift <b>${fmt(e.drift_score)}</b>${e.latency_ms ? ` · ${Math.round(e.latency_ms)} ms` : ""}`;
    feed("read", `${esc(agents[e.agent]?.name)} read <span class="tag">${esc(e.source)}</span> ${sc}<q>${esc(e.preview)}</q>`,
      e.level === "tainted" ? "bad" : e.level === "watch" ? "warn" : ""); },
  message: e => { edge(e.source, e.target, e.source_level); setLevel(e.target, e.level, e.drift_score);
    feed("message", `${esc(agents[e.source]?.name)} → ${esc(agents[e.target]?.name)}${e.source_level === "tainted" || e.source_level === "watch" ? ` · <b>${e.source_level} propagates</b>` : ""}<q>${esc(e.preview)}</q>`, e.level === "tainted" ? "bad" : e.level === "watch" ? "warn" : ""); },
  think: e => feed("decide", `${esc(agents[e.agent]?.name)} <span class="tag">${esc(e.brain)}${e.steered ? " · steered" : ""}</span><q>${esc(e.raw)}</q>`),
  effect: e => { if (e.attacker) bump("attacker_payments"); ledger(e); feed("effect", `${esc(agents[e.agent]?.name)} ran <span class="tag">${esc(e.tool)}</span>${e.attacker ? " · <b>paid the attacker</b>" : ""}`, e.attacker ? "bad" : "good"); },
  blocked: e => (bump("blocked"), feed("blocked", `Anchor blocked <span class="tag">${esc(e.tool)}</span> from ${esc(agents[e.agent]?.name)}<q>${esc(e.reason)}</q>`, "good")),
  approval: e => { bump("approvals"); approval(e); feed("approval", `${esc(agents[e.agent]?.name)} → human: <span class="tag">${esc(e.tool)}</span>`, "warn"); },
  approved: e => feed("approved", `human approved <span class="tag">${esc(e.tool)}</span>`, "good"),
  denied: e => feed("denied", `human denied <span class="tag">${esc(e.tool)}</span>`, "warn"),
  quarantine: e => { e.agents.forEach(id => agents[id]?.node.classList.add("quarantined"));
    feed("quarantine", e.agents.map(id => esc(agents[id]?.name)).join(", ") + " isolated", "warn"); },
  sanitize: e => feed("sanitize", `removed ${e.removed.length} sentence(s) from the source · re-score <b>${fmt(e.rescore)}</b> (threshold ${fmt(e.threshold)})<q>${e.removed.map(esc).join(" ⟂ ")}</q>`, "good"),
  reroute: e => feed("reroute", `task rerouted ${esc(agents[e.source]?.name)} → ${esc(agents[e.target]?.name)}`, "good"),
  escalate: e => feed("escalate", esc(e.reason), "warn"),
  end: e => { tally(e.tally); feed("end", `run finished`); },
  error: e => feed("error", esc(e.error), "bad"),
};
const es = new EventSource("/v1/events");
let live = false;
es.onmessage = m => { const e = JSON.parse(m.data); if (e.kind !== "room") return;
  if (e.type === "start") live = true; if (!live) return; (H[e.type] || (() => {}))(e); };
fetch("/v1/health").then(r => r.json()).then(h => { threshold = h.threshold; watchT = h.watch_threshold;
  $("#health").textContent = `${h.model} · layer ${h.layer} · block ${fmt(h.threshold)}${h.watch_threshold != null ? ` · watch ${fmt(h.watch_threshold)}` : ""} · ${h.device}${h.steering ? " · steering ready" : ""}`; });
tally({});
</script>
</body>
</html>
